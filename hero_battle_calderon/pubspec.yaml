name: hero_battle
description: "A simple hero battle game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.4.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.3
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  path: ^1.9.0
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/Attack.png
    - assets/Defend.png
    - assets/Support.png
    - assets/emptyCard.png
